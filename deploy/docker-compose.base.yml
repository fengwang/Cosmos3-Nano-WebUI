# Shared base for the FP8/NVFP4 local-build stacks (MIG-S6). Not used directly — the
# fp8/nvfp4 files `include:` it and add the per-stack checkpoint mount + label.
# Invoke as `docker compose -f deploy/docker-compose.fp8.yml <cmd>` (project directory
# = deploy/), so `..` is the repo root (build context) and `../models` is <repo>/models.
services:
  webui:
    build:
      context: ..
      dockerfile: deploy/webui.Dockerfile
    image: cosmos3-nano-webui:local
    environment:
      API_INTERNAL_URL: http://api:8000        # server-side BFF target (service DNS)
    ports:
      # Loopback by default; set BIND_ADDR=0.0.0.0 for LAN.
      - "${BIND_ADDR:-127.0.0.1}:${WEBUI_PORT:-3000}:3000"
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    image: cosmos3-nano-api:local
    environment:
      COSMOS3_GEN_ENGINE: ${COSMOS3_GEN_ENGINE:-vllm_omni}
      COSMOS3_VLLM_OMNI_URL: http://vllm-omni:8000            # generation container URL
      COSMOS3_GEN_CONTAINER: cosmos3-nano-webui-vllm-omni     # container it starts/stops
      # AM-S2: reasoning is served by a separate vllm-reasoner container (zero BF16 — the quantized
      # understanding tower via --quantization fp8_blockwise_w8a16). The api starts/stops it, and the
      # single-slot FSM evicts-before-loads vs generation (INV-5). Wired only where a reasoner service
      # exists (fp8 stack); harmless on stacks without one.
      COSMOS3_VLLM_REASONER_URL: ${COSMOS3_VLLM_REASONER_URL:-http://vllm-reasoner:8000}
      COSMOS3_REASONER_CONTAINER: cosmos3-nano-webui-vllm-reasoner
      COSMOS3_CHECKPOINT_LABEL: ${COSMOS3_CHECKPOINT_LABEL:-fp8}
      # Where the api reads the curated negative-prompt default (UX-S2). The per-stack file mounts the
      # checkpoint's assets/ read-only here; if the mount is absent the loader degrades gracefully.
      COSMOS3_MODEL_DIR: ${COSMOS3_MODEL_DIR:-/models/checkpoint}
      # Trusted conditioning-source allowlist (INV-8): the artifact volume (inline uploads persist here)
      # PLUS the read-only checkpoint assets/ dir, so the Action tab's "Run demo" can condition on the
      # checkpoint's shipped example inputs (AM-S3 R-12 fix). Operator-overridable.
      COSMOS3_INPUT_ALLOWLIST: ${COSMOS3_INPUT_ALLOWLIST:-/srv/artifacts:/models/checkpoint/assets}
    ports:
      # Loopback by default (the api also mounts docker.sock); set BIND_ADDR=0.0.0.0 for LAN.
      - "${BIND_ADDR:-127.0.0.1}:${API_PORT:-8000}:8000"
    volumes:
      # Confined docker-socket privilege so DockerCliController can start/stop the
      # generation container (R-06). Fixed-verb, operator-config-name controller only.
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    # No `depends_on` health condition on vllm-omni: the api orchestrator owns its
    # lifecycle (docker start on acquire, stop on evict); cold-start readiness is
    # governed by COSMOS3_PLANE_READY_TIMEOUT, not by Compose (design D-7).

  vllm-omni:
    build:
      context: ..
      dockerfile: deploy/vllm-omni.Dockerfile
    image: cosmos3-nano-vllm-omni:local
    container_name: cosmos3-nano-webui-vllm-omni   # fixed name the api controls by
    # 720p video result transfer (worker<->API-server) rides shared memory; Docker's 64 MB default
    # /dev/shm overflows -> SIGBUS after a successful pipeline. Sized for the video result (UX-S2).
    shm_size: "16gb"
    environment:
      COSMOS3_MODEL_DIR: ${COSMOS3_MODEL_DIR:-/models/checkpoint}   # in-container mount target
      # Reduce 720p CUDA fragmentation at the 32 GB edge (the OOM error recommends it; UX-S2 smoke).
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
    restart: "no"                                   # orchestrator owns start/stop
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # The checkpoint bind-mount is added by the per-stack file (fp8 XOR nvfp4) so there
    # is exactly one source per target (no list-merge duplication).
